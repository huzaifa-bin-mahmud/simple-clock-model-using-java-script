<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-full h-screen grid place-items-center">
      <div class="border p-4 rounded shadow">
        <div class="text-4xl text-center" id="time"></div>
        <div class=" text-center my-3 italic font-bold" id="date"></div>
        <ul class="grid grid-cols-7 gap-4 *:border *:px-3 *:py-1 *:text-center *:rounded *:shadow-gray-400  *:shadow-md *:cursor-pointer" id="day" >
          <li>Sun</li>
          <li>Mon</li>
          <li>tue</li>
          <li>Wed</li>
          <li>Thu</li>
          <li>Fri</li>
          <li>Sat</li>
        </ul>


      </div>

    </div>


    <script src="./script.js"></script>
  </body>
</html>
